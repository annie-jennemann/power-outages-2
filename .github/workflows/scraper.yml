name: Run R Script

on:
  push:
    branches:
      - main
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  R_LIBS_USER: ~/Rlib
  RSPM: https://packagemanager.posit.co/cran/__linux__/noble/latest

jobs:
  run-r-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libssl-dev \
            libgit2-dev \
            libxml2-dev \
            libmagick++-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libfontconfig1-dev \
            pandoc \
            git \
            libudunits2-dev \
            libgdal-dev \
            libgeos-dev \
            libproj-dev \
            proj-data \
            proj-bin \
            gdal-bin

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ~/Rlib
          key: ${{ runner.os }}-R-${{ hashFiles('**/scripts/*.R') }}
          restore-keys: |
            ${{ runner.os }}-R-

      - name: Install R packages
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$R_LIBS_USER"

          Rscript -e 'install.packages(c("fs","usethis","jsonlite","remotes","magick","sf","units","tidyverse"), dependencies = TRUE)'

          Rscript -e 'remotes::install_github("munichrocker/DatawRappr", dependencies = TRUE, upgrade = "never")'
     
      - name: Run R script
        env:
          AP_KEY: ${{ secrets.AP_KEY }}
          CHART_CODE: ${{ secrets.CHART_CODE }}
          URL: ${{ secrets.URL }}
        run: |
          . ~/.Renviron
          Rscript "scripts/power-outage-us-map.R"
